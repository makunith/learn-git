<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="script.js"></script>
    <div class="text">
        <h3>ตัวตนเมื่ออยู่คนเดียวคือ "ธาตุแท้" ที่เป็นอิสระจากการปรุงแต่งของสังคม เป็นช่วงเวลาที่จริงใจกับตัวเองที่สุด ผ่อนคลาย ไม่ต้องแสดงบทบาทที่ผู้อื่นคาดหวัง มักเป็นช่วงที่ใช้ความคิด การทบทวนตัวเอง การอยู่กับความรู้สึกภายใน หรือทำตามใจตัวเองโดยไม่แคร์สายตาใคร</h3>
    </div>

<button class="btn btn-start" onclick="window.location.href='scene2.html'">
    เข้าใจแล้ว
</button>

<div class="audio-control">
  <input type="checkbox" id="mute-toggle" class="mute-checkbox">
  <label for="mute-toggle" class="mute-button">
    <span class="icon-on">🔊</span>
    <span class="icon-off">🔈</span>
  </label>
</div>

<audio id="bg-music" loop>
    <source src="/cafe-music.mp3" type="audio/mpeg">
    เบราว์เซอร์ของคุณไม่รองรับการเล่นเสียง
</audio>
